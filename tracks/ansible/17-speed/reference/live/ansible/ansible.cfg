# Ansible configuration for this repo. Run ansible from this directory (ansible/) so that this
# file is used; Ansible ignores an ansible.cfg in a world-writable directory.
[defaults]
# Collections and roles come from this project only, never from ~/.ansible: the versions are the
# ones pinned in collections/requirements.yml, on every machine and in CI.
collections_path = ./collections
roles_path = ./roles
inventory = inventory/azure_rm.yml
interpreter_python = auto_silent
callback_result_format = yaml

# Speed (an-17). Three VMs don't need more forks, but the fleet will grow: 20 parallel hosts.
forks = 20
# Facts are gathered once and cached for 2 hours (per host, JSON files in .facts/, gitignored).
# "smart" gathers only for hosts without fresh cached facts, so a second run skips the gathering
# round trip. Nothing secret is in there: set_fact results are cached only with cacheable: true,
# which no role uses (nginx's TLS bundle must never be).
gathering = smart
fact_caching = ansible.builtin.jsonfile
fact_caching_connection = ./.facts
fact_caching_timeout = 7200
# Per-task timings at the end of a run: where the time goes, before and after a change.
callbacks_enabled = ansible.posix.profile_tasks

[inventory]
# Only the plugins this repo uses: the Azure inventory, plus host lists for `-i host,` one-offs.
enable_plugins = azure.azcollection.azure_rm, ansible.builtin.host_list

[ssh_connection]
# The lab VMs are rebuilt by pause/resume with new host keys (and the jump host with a new IP), so
# host keys are not recorded. A long-lived fleet pins them instead (known_hosts from a trusted
# source, or SSH host certificates).
# IdentitiesOnly: offer only the lab key. An ssh-agent holding 3+ keys would otherwise use up
# sshd's MaxAuthTries (3 after an-03) before the right key is tried, and every VM rejects Ansible.
# ControlPersist 10 minutes: one SSH connection per host (two for the web VMs, the jump hop
# included) for a whole run and the next one, instead of a new handshake per task.
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
# Pipelining: modules go through the open SSH session's stdin instead of a copied file, one round
# trip per task fewer. Needs sudo without requiretty (Ubuntu's default).
pipelining = True
