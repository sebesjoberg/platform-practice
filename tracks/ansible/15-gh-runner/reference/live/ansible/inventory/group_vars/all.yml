---
# How Ansible logs in to every lab VM: tf-25 created the admin user and authorized this key.
ansible_user: azureuser
ansible_ssh_private_key_file: ~/.ssh/{{PREFIX}}_lab

# Role base: the ops user's keys, managed exclusively.
#   - the public half of your lab key (the private key never leaves your machine). CI on the
#     runner has no such file and sets acme_lab_pubkey from the repo variable SSH_PUBLIC_KEY.
#   - from an-15, the CI runner's key: generated by role gh_runner on the jump host and read from
#     there by site.yml (acme_runner_pubkey) on every run, so a rebuilt runner's new key needs no
#     edit. No private key ever leaves the machine it was made on.
acme_lab_pubkey: "{{ lookup('ansible.builtin.file', '~/.ssh/{{PREFIX}}_lab.pub') }}"
acme_runner_pubkey_file: /home/gh-runner/.ssh/id_ed25519.pub
base_ops_authorized_keys: >-
  {{ [acme_lab_pubkey | trim]
  + ([acme_runner_pubkey.content | b64decode | trim] if (acme_runner_pubkey | default({})).content is defined else []) }}

# How the Key Vault lookups authenticate: `cli` is your az login on this machine. CI on the jump
# host (an-16) runs with -e acme_kv_auth_source=msi: the VM's managed identity, which tf-25 made
# Key Vault Secrets User on both vaults. The lookups only try the MSI endpoint when this says msi.
acme_kv_auth_source: cli
