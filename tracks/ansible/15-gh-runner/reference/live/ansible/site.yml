---
# The whole fleet, in order.
#   ansible-playbook site.yml
- name: Baseline every VM
  hosts: all
  become: true
  pre_tasks:
    # The CI runner's public key (role gh_runner, runner.yml), read on the jump host on every run
    # (also with --limit) so that role base authorizes it for the ops user everywhere: CI reaches
    # the fleet with a key that never left the jump host. Before the runner exists there is no
    # file, and base authorizes only your lab key. Any other failure to read it stops the run.
    - name: Read the CI runner's public SSH key on the jump host
      ansible.builtin.slurp:
        src: "{{ acme_runner_pubkey_file }}"
      delegate_to: "{{ groups['role_jump'] | first }}"
      run_once: true
      register: acme_runner_pubkey
      # Only a missing file is fine (no runner yet). Anything else stops the run: role base manages
      # ops' keys exclusively and would strip the runner's key from every VM.
      failed_when: >-
        acme_runner_pubkey is failed
        and 'file not found' not in (acme_runner_pubkey.msg | default('') | lower)
    # The jump host unreachable: the slurp result is no failure the line above can see. Every host
    # checks what it got before base runs.
    - name: Stop unless the runner's key was read or doesn't exist yet
      ansible.builtin.assert:
        that: >-
          acme_runner_pubkey.content is defined
          or 'file not found' in (acme_runner_pubkey.msg | default('') | lower)
        fail_msg: >-
          Could not read {{ acme_runner_pubkey_file }} on the jump host; role base would remove
          the CI runner's key from every VM. Fix the jump host, then run again.
        quiet: true
  roles:
    - role: acme.platform.base

# The app's configuration, then the app (it waits for its own health), then nginx in front of it.
- name: Web servers
  hosts: role_web
  become: true
  roles:
    - role: acme.platform.app_env
    - role: acme.platform.acme_hello
    - role: acme.platform.nginx

# After the web servers, so HAProxy's first health checks find them serving.
- name: Load balancer
  hosts: role_jump
  become: true
  roles:
    - role: acme.platform.haproxy
