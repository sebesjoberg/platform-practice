---
# Molecule scenario for role base: an Ubuntu 24.04 container that boots systemd, so services and
# handlers (sshd reload) run for real. Run from ansible/roles/base with the venv active:
#   molecule test        (create, converge, idempotence, verify, destroy)
#   molecule converge    (keep the container; molecule login to look around)
driver:
  name: docker

platforms:
  - name: base-noble
    image: ubuntu:24.04
    # Dockerfile.j2 next to this file adds systemd, python3 and sudo to the image.
    dockerfile: Dockerfile.j2
    pre_build_image: false
    command: /lib/systemd/systemd
    # systemd as PID 1 needs the cgroup hierarchy and a tmpfs /run. No privileged mode.
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
      - /tmp

ansible:
  env:
    # Molecule replaces the repo's ansible.cfg with its own, so say again what it said: roles
    # from ansible/roles (converge.yml applies `base`, as site.yml does) and the collections
    # installed into ansible/collections (keeping any path already set, e.g. in CI).
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../../collections:${ANSIBLE_COLLECTIONS_PATH:-~/.ansible/collections}

verifier:
  name: ansible
