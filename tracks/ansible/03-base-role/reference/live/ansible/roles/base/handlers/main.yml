---
# Reload, not restart: open sessions (Ansible's own included) survive. A service that isn't
# running yet is started.
- name: Reload sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Restart chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: restarted
