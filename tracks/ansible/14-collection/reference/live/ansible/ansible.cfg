# Ansible configuration for this repo. Run ansible from this directory (ansible/) so that this
# file is used; Ansible ignores an ansible.cfg in a world-writable directory.
[defaults]
# Collections and roles come from this project only, never from ~/.ansible: the versions are the
# ones pinned in collections/requirements.yml, on every machine and in CI.
collections_path = ./collections
roles_path = ./roles
inventory = inventory/azure_rm.yml
interpreter_python = auto_silent
forks = 10
callback_result_format = yaml

[inventory]
# Only the plugins this repo uses: the Azure inventory, plus host lists for `-i host,` one-offs.
enable_plugins = azure.azcollection.azure_rm, ansible.builtin.host_list

[ssh_connection]
# The lab VMs are rebuilt by pause/resume with new host keys (and the jump host with a new IP), so
# host keys are not recorded. A long-lived fleet pins them instead (known_hosts from a trusted
# source, or SSH host certificates).
# IdentitiesOnly: offer only the lab key. An ssh-agent holding 3+ keys would otherwise use up
# sshd's MaxAuthTries (3 after an-03) before the right key is tried, and every VM rejects Ansible.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
