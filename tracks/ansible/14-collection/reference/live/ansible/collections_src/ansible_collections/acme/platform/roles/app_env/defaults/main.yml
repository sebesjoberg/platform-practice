---
# The environment file the app's systemd unit reads (EnvironmentFile=).
app_env_path: /etc/acme/app.env

# Group that may read it besides root: operators, and an app that opens the file itself. A unit
# that loads it with EnvironmentFile= doesn't need it: systemd (PID 1) reads that file as root,
# before it drops privileges to the service user.
app_env_group: acme

# app_env_vars (required, no default): variable name -> value, one KEY=value line each. The
# inventory fills it from Key Vault; the role never sees where the values come from.

# The app's JSON settings file, shared with the app team's release tooling: the role sets only the
# keys in app_env_settings (with the module acme_app_setting) and leaves the others alone.
app_env_settings_path: /etc/acme/settings.json

# Setting -> value (any JSON type). Dots nest: features.x is the key x in the object features.
app_env_settings: {}
