---
# Role haproxy on the jump host: the dev web servers of the inventory (role_web and env_dev), by
# private IP (the jump host reaches them over the hub-spoke peering). Built at run time from the
# inventory, so a rebuilt web VM with a new IP needs no edit: { vm-<prefix>-web-dev-1: 10.1.1.x }.
# Prod web servers (env_prod) never join this load balancer: prod gets its own.
haproxy_backends: >-
  {{ dict(groups['role_web'] | intersect(groups['env_dev'])
  | zip(groups['role_web'] | intersect(groups['env_dev']) | map('extract', hostvars, ['private_ipv4_addresses', 0]))) }}

# Role gh_runner (runner.yml): the jump host is the repo's self-hosted runner (an-15).
gh_runner_repo_url: https://github.com/{{GH_OWNER}}/{{LIVE_REPO}}
