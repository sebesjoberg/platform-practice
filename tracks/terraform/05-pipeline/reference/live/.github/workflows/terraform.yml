name: terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stacks:
        description: "Stacks to apply: all, or a space/comma separated list such as landing-zone"
        required: false
        default: all
        type: string

permissions:
  contents: read

env:
  TF_VERSION: "1.17.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # OIDC with the CI managed identity (tf-04): no client secret anywhere.
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  # Dependency order. Stacks found but not listed here run afterwards, alphabetically.
  STACK_ORDER: "landing-zone shared env-dev env-prod observability teams/payments"

jobs:
  stacks:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.find.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - name: Find stacks
        id: find
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.stacks || 'all' }}
        run: |
          set -f
          # A stack = a directory under terraform/ with an azurerm backend. bootstrap is applied
          # locally only: CI must never manage its own identity.
          found=$(grep -rlE --include='*.tf' 'backend[[:space:]]+"azurerm"' terraform \
            | xargs -r -n1 dirname | sed 's|^terraform/||' | grep -vx bootstrap | sort -u || true)
          ordered=""
          for s in $STACK_ORDER; do
            if grep -qx "$s" <<<"$found"; then ordered="$ordered $s"; fi
          done
          for s in $found; do
            if [[ " $ordered " != *" $s "* ]]; then ordered="$ordered $s"; fi
          done
          if [[ "$REQUESTED" != all ]]; then
            want=" ${REQUESTED//,/ } "
            for w in $want; do
              if [[ " $ordered " != *" $w "* ]]; then
                echo "::error::unknown stack: $w"
                exit 1
              fi
            done
            selected=""
            for s in $ordered; do
              if [[ "$want" == *" $s "* ]]; then selected="$selected $s"; fi
            done
            ordered=$selected
          fi
          ordered="${ordered# }"
          echo "stacks: ${ordered:-none}"
          echo "list=$ordered" >> "$GITHUB_OUTPUT"

  plan:
    needs: stacks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform
      - name: terraform init, validate, plan
        id: plan
        env:
          STACKS: ${{ needs.stacks.outputs.list }}
        run: |
          {
            echo "### Terraform plan"
            echo
            echo "Commit ${GITHUB_SHA::7}, [workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > "$RUNNER_TEMP/comment.md"
          rc=0
          for s in $STACKS; do
            d="terraform/$s"
            log="$RUNNER_TEMP/plan-${s//\//-}.log"
            if terraform -chdir="$d" init -input=false -no-color >"$log" 2>&1 &&
              terraform -chdir="$d" validate -no-color >>"$log" 2>&1 &&
              terraform -chdir="$d" plan -input=false -no-color -lock-timeout=5m -out=tfplan >>"$log" 2>&1; then
              summary=$(grep -m1 -E '^(Plan:|No changes\.)' "$log" || echo "planned")
              terraform -chdir="$d" show -no-color tfplan >"$log.out"
            else
              rc=1
              summary="FAILED"
              cp "$log" "$log.out"
            fi
            cat "$log"
            {
              echo
              echo "<details><summary><b>$s</b>: $summary</summary>"
              echo
              echo '```'
              head -c 15000 "$log.out"
              echo
              echo '```'
              echo "</details>"
            } >> "$RUNNER_TEMP/comment.md"
          done
          exit "$rc"
      - name: Comment the plan on the PR
        if: always() && (steps.plan.outcome == 'success' || steps.plan.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"

  apply:
    needs: stacks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Applies queue up; never cancel one half-way.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: terraform apply
        env:
          STACKS: ${{ needs.stacks.outputs.list }}
        run: |
          for s in $STACKS; do
            echo "::group::apply $s"
            terraform -chdir="terraform/$s" init -input=false
            terraform -chdir="terraform/$s" apply -auto-approve -input=false -lock-timeout=5m
            echo "::endgroup::"
          done
