name: terraform

# Starter from ./lab.sh next (tf-05). Triggers, permissions, checkout, Terraform setup and the
# OIDC login are done. Fill in every TODO marker below, then commit this file and
# .github/scripts/stacks.sh together with terraform/landing-zone.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stacks:
        description: "Stacks to apply: all, or a space/comma separated list such as landing-zone"
        required: false
        default: all
        type: string

permissions:
  contents: read

env:
  TF_VERSION: "1.17.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # OIDC with the CI managed identity (tf-04): no client secret anywhere.
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  # Dependency order for .github/scripts/stacks.sh. Stacks not listed run afterwards, alphabetically.
  STACK_ORDER: "landing-zone shared env-dev env-prod observability teams/payments"

jobs:
  # Keep exactly these two jobs. "plan" becomes a required status check in tf-06.
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Find stacks
        id: stacks
        run: |
          # On its own line so a failing stacks.sh fails the step (bash -e); echo would hide it.
          list="$(bash .github/scripts/stacks.sh all)"
          if [ -z "$list" ]; then echo "::error::no stacks found under terraform/"; exit 1; fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # TODO(tf-05): check formatting of everything under terraform/ (fail the job if unformatted).
      # TODO(tf-05): for each stack in ${{ steps.stacks.outputs.list }} (pass it in through env:),
      #   run init, validate and plan in terraform/<stack>, and collect the plan output.
      #   Keep going after a failing stack, but fail the step at the end.
      # TODO(tf-05): post ONE comment on the PR whose body starts with "### Terraform plan",
      #   with each stack's plan, also when a plan failed. Keep it below GitHub's 64 KB comment
      #   limit (truncate long plans). Hint: gh pr comment with GH_TOKEN: ${{ github.token }}.

  apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Applies queue up; never cancel one half-way.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Find stacks
        id: stacks
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.stacks || 'all' }}
        run: |
          # On its own line so an unknown stack name fails the step (bash -e); echo would hide it.
          list="$(bash .github/scripts/stacks.sh "$REQUESTED")"
          if [ -z "$list" ]; then echo "::error::no stacks to apply"; exit 1; fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # TODO(tf-05): for each stack in ${{ steps.stacks.outputs.list }}, in order, run init and
      #   apply -auto-approve in terraform/<stack>. Stop at the first failure.
