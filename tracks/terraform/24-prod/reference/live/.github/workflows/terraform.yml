name: terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stacks:
        description: "Stacks to apply: all, or a space/comma separated list such as landing-zone"
        required: false
        default: all
        type: string

permissions:
  contents: read

env:
  TF_VERSION: "1.17.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # OIDC with the CI managed identity (tf-04): no client secret anywhere.
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  # Budget alert address (tf-12) for both jobs: plan needs every variable as much as apply.
  # A repo secret, not a tfvars file (gitignored) or a variable: the repo is public, and GitHub
  # prints env values in every step log; secrets are masked there.
  TF_VAR_budget_email: ${{ secrets.BUDGET_EMAIL }}
  # tf-24: changes to these paths are Terraform's business. A push or PR that touches none of them
  # (the Ansible track's code, docs) skips plan's work and both apply jobs: no prod approval and no
  # red run for a README.
  TF_PATHS: '^(terraform/|\.github/workflows/terraform\.yml$|\.github/scripts/|\.trivyignore\.yaml$|\.tflint\.hcl$)'
  # Dependency order for .github/scripts/stacks.sh. Stacks not listed run afterwards, alphabetically.
  STACK_ORDER: "landing-zone shared env-dev env-prod observability teams/payments"

jobs:
  # "plan" is the required status check (tf-06): it never needs another job, so nothing can run
  # before it, fail and leave it skipped (a skipped required check counts as passed). The apply
  # jobs only run on main: changes decides whether Terraform has anything to do, then apply
  # (every stack but env-prod), then apply-prod (tf-24).
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base branch too, for the diff below
          persist-credentials: false
      # Did this PR touch Terraform? If not, every step below is skipped and plan still reports
      # success: it is the required check, and an Ansible-only PR must be able to merge.
      - name: What changed
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed-files"
          if grep -qE "$TF_PATHS" "$RUNNER_TEMP/changed-files"; then changed=true; else changed=false; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Terraform changes in this PR: $changed"
      - name: Find stacks
        if: steps.changes.outputs.changed == 'true'
        id: stacks
        run: |
          # On its own line so a failing stacks.sh fails the step (bash -e); echo would hide it.
          list="$(bash .github/scripts/stacks.sh all)"
          if [ -z "$list" ]; then echo "::error::no stacks found under terraform/"; exit 1; fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        if: steps.changes.outputs.changed == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        if: steps.changes.outputs.changed == 'true'
        run: terraform fmt -check -recursive -diff terraform
      # tf-17: module tests run here, in the required plan job, not in a job of their own.
      # mock_provider tests need no Azure; a failing test fails the job before any plan.
      - name: terraform test (modules)
        if: steps.changes.outputs.changed == 'true'
        run: |
          if [ ! -d terraform/modules ]; then echo "no modules under terraform/modules"; exit 0; fi
          for d in $(find terraform/modules -name '*.tftest.hcl' -path '*/tests/*' -exec dirname {} \; | xargs -r -n1 dirname | sort -u); do
            echo "::group::terraform test $d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" test
            echo "::endgroup::"
          done
      # tf-18: lint and scan every stack and module; any finding fails the plan job.
      - uses: terraform-linters/setup-tflint@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          tflint_version: v0.66.0
      - name: tflint
        if: steps.changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint --init downloads the azurerm ruleset from GitHub
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --chdir terraform
      - name: trivy config scan
        if: steps.changes.outputs.changed == 'true'
        env:
          TRIVY_VERSION: "0.76.2"
        run: |
          curl -sSfL "https://raw.githubusercontent.com/aquasecurity/trivy/v${TRIVY_VERSION}/contrib/install.sh" |
            sh -s -- -b "$RUNNER_TEMP/bin" "v${TRIVY_VERSION}"
          # trivy exits 0 on findings unless told otherwise. It also downloads the modules the
          # stacks pin from the modules repo; their findings belong to that repo's CI (tf-21),
          # so this scan covers only this repo's code.
          "$RUNNER_TEMP/bin/trivy" config --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml \
            --tf-exclude-downloaded-modules terraform
      # Log in to Azure only now: the steps above (formatting, tests, linters, scanners) never
      # run with an authenticated session.
      - uses: azure/login@v2
        if: steps.changes.outputs.changed == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: terraform init, validate, plan
        if: steps.changes.outputs.changed == 'true'
        id: plan
        env:
          STACKS: ${{ steps.stacks.outputs.list }}
        run: |
          comment="$RUNNER_TEMP/comment.md"
          {
            echo "### Terraform plan"
            echo
            echo "Commit ${GITHUB_SHA::7}, [workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > "$comment"
          max=9000 # bytes of plan output per stack; keeps the comment far below GitHub's 64 KB limit
          rc=0
          for s in $STACKS; do
            d="terraform/$s"
            log="$RUNNER_TEMP/plan-${s//\//-}.log"
            if terraform -chdir="$d" init -input=false -no-color >"$log" 2>&1 &&
              terraform -chdir="$d" validate -no-color >>"$log" 2>&1 &&
              terraform -chdir="$d" plan -input=false -no-color -lock-timeout=5m -out=tfplan >>"$log" 2>&1; then
              summary=$(grep -m1 -E '^(Plan:|No changes\.)' "$log" || echo "planned")
              terraform -chdir="$d" show -no-color tfplan >"$log.out"
            else
              rc=1
              summary="FAILED"
              cp "$log" "$log.out"
            fi
            cat "$log"
            {
              echo
              echo "<details><summary><b>$s</b>: $summary</summary>"
              echo
              echo '```'
              head -c "$max" "$log.out"
              echo
              if [ "$(wc -c <"$log.out")" -gt "$max" ]; then echo "(truncated — see the run log)"; fi
              echo '```'
              echo "</details>"
            } >> "$comment"
          done
          if [ "$(wc -c <"$comment")" -gt 60000 ]; then
            head -c 60000 "$comment" > "$comment.cut"
            { echo; echo '```'; echo; echo "(truncated — see the run log)"; } >> "$comment.cut"
            mv "$comment.cut" "$comment"
          fi
          exit "$rc"
      - name: Comment the plan on the PR
        if: always() && steps.changes.outputs.changed == 'true' && (steps.plan.outcome == 'success' || steps.plan.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"

  # Push and manual runs (tf-24): did this push change anything Terraform cares about? A manual run
  # (workflow_dispatch), a branch's first push and a push whose "before" commit is gone (a force
  # push) always count as a change. A job of its own: plan runs on pull requests only.
  changes:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the "before" commit too
          persist-credentials: false
      - name: What changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          changed=true
          if [ "$EVENT" = push ] && [[ ! "$BEFORE" =~ ^0*$ ]] &&
            git diff --name-only "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files" 2>/dev/null; then
            if ! grep -qE "$TF_PATHS" "$RUNNER_TEMP/changed-files"; then changed=false; fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Terraform changes: $changed"

  apply:
    needs: changes
    # Skipped jobs request no approval and leave the run green.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # Applies queue up; never cancel one half-way.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      prod: ${{ steps.stacks.outputs.prod }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Find stacks
        id: stacks
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.stacks || 'all' }}
        run: |
          # On its own line so an unknown stack name fails the step (bash -e); echo would hide it.
          list="$(bash .github/scripts/stacks.sh "$REQUESTED")"
          if [ -z "$list" ]; then echo "::error::no stacks to apply"; exit 1; fi
          # env-prod is never applied here: apply-prod applies it in the prod environment (tf-24).
          rest="" prod=false
          for s in $list; do
            if [ "$s" = env-prod ]; then prod=true; else rest="$rest $s"; fi
          done
          echo "list=${rest# }" >> "$GITHUB_OUTPUT"
          echo "prod=$prod" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: terraform apply
        env:
          STACKS: ${{ steps.stacks.outputs.list }}
        run: |
          for s in $STACKS; do
            echo "::group::apply $s"
            terraform -chdir="terraform/$s" init -input=false
            terraform -chdir="terraform/$s" apply -auto-approve -input=false -lock-timeout=5m
            echo "::endgroup::"
          done

  # Prod (tf-24): after everything else applied cleanly, and only with a human "yes". The prod
  # environment (tf-06) holds the job until its required reviewer approves. A job in an
  # environment gets the OIDC subject <prefix>:environment:prod, which only the federated
  # credential gh-env-prod (tf-04) trusts.
  apply-prod:
    needs: [changes, apply]
    if: needs.changes.outputs.changed == 'true' && needs.apply.outputs.prod == 'true'
    runs-on: ubuntu-latest
    environment: prod
    # Its own queue: waiting for an approval must not hold up dev applies.
    concurrency:
      group: terraform-apply-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: terraform apply env-prod
        run: |
          terraform -chdir=terraform/env-prod init -input=false
          terraform -chdir=terraform/env-prod apply -auto-approve -input=false -lock-timeout=5m
